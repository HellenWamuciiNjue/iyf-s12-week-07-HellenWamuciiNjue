name: Week 7 quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format project files
        run: npm run format
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
