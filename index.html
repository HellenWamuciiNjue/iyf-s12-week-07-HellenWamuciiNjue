<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 To-Do List</title><link rel="stylesheet" href="styles.css"><script type="module" src="js/app.js"></script></head><body><main class="container"><header><p class="eyebrow">WEEK 7 · JAVASCRIPT BEST PRACTICES</p><h1>My To-Do List</h1><p class="muted">A little progress every day adds up.</p></header><form id="todo-form"><label class="sr-only" for="todo-input">New task</label><input id="todo-input" maxlength="180" placeholder="What needs doing?" autocomplete="off"><button class="primary">Add task</button></form><p id="form-error" role="alert"></p><section class="panel"><div class="heading"><h2>Your tasks</h2><span id="task-total" class="muted">0 tasks</span></div><nav class="filters" aria-label="Task filters"><button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button></nav><ul id="todo-list"></ul><p id="empty-state">Nothing here yet. Add your first task above.</p><footer class="heading"><span id="items-left">0 items left</span><button type="button" id="clear-completed" class="plain">Clear completed</button></footer></section><p class="muted note">Tick to complete · Double-click to edit · Enter saves · Escape cancels</p><p class="muted note">● Tasks are saved on this device.</p></main></body></html>
