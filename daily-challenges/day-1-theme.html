<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 1 — Theme Toggle</title><style>body{font:1rem system-ui;max-width:650px;margin:4rem auto;padding:1rem;background:var(--bg);color:var(--fg)}body.dark{--bg:#172033;--fg:#f4f6fb}body:not(.dark){--bg:#f5f7fb;--fg:#172033}button{padding:.8rem 1rem}</style></head><body><h1>Day 1 — Theme Toggle</h1><p>Choose a theme. Your choice is saved on this device.</p><button id="theme">Toggle theme</button><script>const key="week7-theme";function applyTheme(theme){document.body.classList.toggle("dark",theme==="dark");document.querySelector("#theme").textContent=theme==="dark"?"Switch to light":"Switch to dark"}let theme=localStorage.getItem(key)||"light";applyTheme(theme);document.querySelector("#theme").addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem(key,theme);applyTheme(theme)});</script></body></html>
