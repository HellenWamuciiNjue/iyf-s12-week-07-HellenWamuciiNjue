<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 2 — Recent Searches</title></head><body><main><h1>Recent Searches</h1><form id="form"><input id="query" placeholder="Search term" required><button>Search</button></form><label for="history">Recent searches</label><select id="history"><option value="">Choose a previous search</option></select><p id="result" role="status"></p></main><script>const key="week7-recent-searches";let searches=[];try{searches=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(searches))searches=[]}catch{searches=[]}const history=document.querySelector("#history");function render(){history.replaceChildren(new Option("Choose a previous search",""));searches.forEach(term=>history.add(new Option(term,term)))}function search(term){const clean=term.trim();if(!clean)return;searches=[clean,...searches.filter(item=>item.toLowerCase()!==clean.toLowerCase())].slice(0,5);localStorage.setItem(key,JSON.stringify(searches));document.querySelector("#query").value=clean;document.querySelector("#result").textContent="You searched for: "+clean;render()}document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();search(document.querySelector("#query").value)});history.addEventListener("change",()=>{if(history.value)search(history.value)});render();</script></body></html>
