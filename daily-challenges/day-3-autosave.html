<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 3 — Form Auto-Save</title></head><body><main><h1>Day 3 — Form Auto-Save</h1><p>Your draft is saved every five seconds and restored after refresh.</p><form id="form"><label>Name <input name="name"></label><br><label>Email <input name="email" type="email"></label><br><label>Message <textarea name="message"></textarea></label><br><button>Submit</button></form><p id="status" role="status"></p></main><script>const form=document.querySelector("#form"),key="week7-day3-draft";try{const saved=JSON.parse(localStorage.getItem(key)||"{}");Object.entries(saved).forEach(([name,value])=>{if(form.elements[name])form.elements[name].value=value})}catch{localStorage.removeItem(key)}function save(){localStorage.setItem(key,JSON.stringify(Object.fromEntries(new FormData(form))))}const timer=setInterval(save,5000);form.addEventListener("submit",e=>{e.preventDefault();save();localStorage.removeItem(key);form.reset();document.querySelector("#status").textContent="Submitted. Draft cleared.";clearInterval(timer)});window.addEventListener("pagehide",save);</script></body></html>
